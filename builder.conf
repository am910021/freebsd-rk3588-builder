# Shared FreeBSD RK3588 builder settings.
# Environment variables take precedence over these defaults.

UBOOT_VERSION=${UBOOT_VERSION:-2026.07}

# Board configuration is optional for board-independent builds.
BOARD=${BOARD:-}
BOARD_DIR=${BOARD_DIR:-}
BOARD_CONFIG=${BOARD_CONFIG:-}
BOARD_FILES_DIR=${BOARD_FILES_DIR:-}
if [ -n "${BOARD}" ]; then
	BOARD_DIR=${BOARD_DIR:-${BUILDER_ROOT}/boards/${BOARD}}
	BOARD_CONFIG=${BOARD_CONFIG:-${BOARD_DIR}/board.conf}
	[ -r "${BOARD_CONFIG}" ] || {
		echo "builder.conf: missing board config: ${BOARD_CONFIG}" >&2
		return 1
	}
	. "${BOARD_CONFIG}"
	BOARD_FILES_DIR=${BOARD_FILES_DIR:-${BOARD_DIR}/files}
fi

# Space-separated DTBO filenames copied from the target root filesystem.
UBOOT_FDT_OVERLAYS=${UBOOT_FDT_OVERLAYS:-}

# ==============================================================================
# Git checkout settings
# A non-empty *_COMMIT pins an exact revision and overrides *_BRANCH.
GIT_URL=${GIT_URL:-https://github.com/am910021}
FREEBSD_URL=${FREEBSD_URL:-${GIT_URL}/freebsd-src.git}
UBOOT_URL=${UBOOT_URL:-${GIT_URL}/u-boot.git}
RKBIN_URL=${RKBIN_URL:-${GIT_URL}/rkbin.git}
IF_RGE_URL=${IF_RGE_URL:-${GIT_URL}/if_rge_freebsd.git}

FREEBSD_BRANCH=${FREEBSD_BRANCH:-yuri/14.3-p16_rk3588-overlay}
FREEBSD_COMMIT=${FREEBSD_COMMIT:-}

UBOOT_BRANCH=${UBOOT_BRANCH:-yuri/rk3588}
UBOOT_COMMIT=${UBOOT_COMMIT:-}

IF_RGE_BRANCH=${IF_RGE_BRANCH:-yuri/14.3}
IF_RGE_COMMIT=${IF_RGE_COMMIT:-}

RKBIN_BRANCH=${RKBIN_BRANCH:-master}
RKBIN_COMMIT=${RKBIN_COMMIT:-feab2172b40f831a1f0c0e2eacc348c19ea2f780}
# ==============================================================================


# Source is persistent, work is rebuildable, and output contains deliverables.
SRC_ROOT=${SRC_ROOT:-${BUILDER_ROOT}/src}
WORK_ROOT=${WORK_ROOT:-${BUILDER_ROOT}/work}
OUTPUT_ROOT=${OUTPUT_ROOT:-${BUILDER_ROOT}/output}

FREEBSD_SRC_DIR=${FREEBSD_SRC_DIR:-${SRC_ROOT}/freebsd-src}
UBOOT_SRC_DIR=${UBOOT_SRC_DIR:-${SRC_ROOT}/u-boot-${UBOOT_VERSION}}
IF_RGE_SRC_DIR=${IF_RGE_SRC_DIR:-${SRC_ROOT}/if_rge_freebsd}
RKBIN_SRC_DIR=${RKBIN_SRC_DIR:-${SRC_ROOT}/rkbin}
RGE_PORT_DIR=${RGE_PORT_DIR:-${SRC_ROOT}/ports/net/realtek-rge-kmod}
# Local no-architecture package used only by INSTALLER=YES images.
RK3588_INSTALLER_PORT_DIR=${RK3588_INSTALLER_PORT_DIR:-${SRC_ROOT}/ports/sysutils/rk3588-installer}
UBOOT_BL31=${UBOOT_BL31:-${RKBIN_SRC_DIR}/bin/rk35/rk3588_bl31_v1.48.elf}
UBOOT_ROCKCHIP_TPL=${UBOOT_ROCKCHIP_TPL:-${RKBIN_SRC_DIR}/bin/rk35/rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.18.bin}

# Derive a version such as 14.3-p16 from the checked-out FreeBSD source.
FREEBSD_OBJ_VERSION=${FREEBSD_OBJ_VERSION:-}
FREEBSD_NEWVERS=${FREEBSD_SRC_DIR}/sys/conf/newvers.sh
if [ -z "${FREEBSD_OBJ_VERSION}" ] && [ -r "${FREEBSD_NEWVERS}" ]; then
	eval "$(sh "${FREEBSD_NEWVERS}" -V REVISION -V BRANCH)"
	FREEBSD_OBJ_VERSION=${REVISION}-${BRANCH#RELEASE-}
	unset REVISION BRANCH
fi
FREEBSD_OBJ_VERSION=${FREEBSD_OBJ_VERSION:-unversioned}
unset FREEBSD_NEWVERS

# Keep all release artifacts for one FreeBSD version together.
VERSION_OUTPUT_ROOT=${VERSION_OUTPUT_ROOT:-${OUTPUT_ROOT}/${FREEBSD_OBJ_VERSION}}
IMAGE_OUTPUT_DIR=${IMAGE_OUTPUT_DIR:-${VERSION_OUTPUT_ROOT}}
TXZ_ROOT=${TXZ_ROOT:-${VERSION_OUTPUT_ROOT}}

# Keep cross-build objects outside the source and release output trees.
FREEBSD_OBJ_ROOT=${FREEBSD_OBJ_ROOT:-${WORK_ROOT}/obj/${FREEBSD_OBJ_VERSION}}
FREEBSD_OBJ=${FREEBSD_OBJ:-${FREEBSD_OBJ_ROOT}/arm64.aarch64}
FREEBSD_KERNCONF=${FREEBSD_KERNCONF:-GENERIC}
KERNBUILDDIR=${KERNBUILDDIR:-${FREEBSD_OBJ}/sys/${FREEBSD_KERNCONF}}

# U-Boot assets and disk image layout. Sizes are in MiB.
BOOTMENU_ENV=${BOOTMENU_ENV:-}
UBOOT_LOGO_BMP=${UBOOT_LOGO_BMP:-}
UBOOT_LOGO_ENABLE=${UBOOT_LOGO_ENABLE:-YES}
UBOOT_DEFCONFIG=${UBOOT_DEFCONFIG:-}
UBOOT_LOGO_CONFIG=${UBOOT_LOGO_CONFIG:-}
UBOOT_BINARY_MARKER=${UBOOT_BINARY_MARKER:-}
FREEBSD_DTS=${FREEBSD_DTS:-}
ROOT_LABEL=${ROOT_LABEL:-}
IMAGE_HOSTNAME=${IMAGE_HOSTNAME:-}
FREEBSD_DTB_ESP_PATH=${FREEBSD_DTB_ESP_PATH:-}
ZFS_POOL_NAME=${ZFS_POOL_NAME:-}
# Complete firmware bundles support only 16 or 32 MiB.
FIRMWARE_MIB=${FIRMWARE_MIB:-16}
ESP_SIZE_MIB=${ESP_SIZE_MIB:-256}
# Set to zero to omit the swap partition.
SWAP_SIZE_MIB=${SWAP_SIZE_MIB:-512}
ROOT_SIZE_MIB=${ROOT_SIZE_MIB:-1024}
IMAGE_TAIL_MIB=${IMAGE_TAIL_MIB:-96}
# Root filesystem can be ufs or zfs; ZFS generally needs at least 2048 MiB.
ROOTFS_TYPE=${ROOTFS_TYPE:-ufs}

# Host tools and cross-toolchain settings.
CROSS_COMPILE=${CROSS_COMPILE:-aarch64-none-elf-}
JOBS=${JOBS:-$(sysctl -n hw.ncpu 2>/dev/null || echo 4)}

# if_rge uses the same versioned FreeBSD object tree and toolchain.
RGE_WORK_DIR=${RGE_WORK_DIR:-${WORK_ROOT}/if_rge_freebsd}
TOOLBIN=${TOOLBIN:-${FREEBSD_OBJ}/tmp/usr/bin}

# Default inputs consumed by the final board image build.
BASE_TXZ=${BASE_TXZ:-${TXZ_ROOT}/base.txz}
KERNEL_TXZ=${KERNEL_TXZ:-${TXZ_ROOT}/kernel.txz}
RGE_PKG=${RGE_PKG:-${TXZ_ROOT}/if_rge.pkg}
UBOOT_DIR=${UBOOT_DIR:-${WORK_ROOT}/uboot-latest}
FREEBSD_DTB=${FREEBSD_DTB:-${UBOOT_DIR}/freebsd-runtime.dtb}
IMAGE_LOGO_BMP=${IMAGE_LOGO_BMP:-${UBOOT_DIR}/logo.bmp}
