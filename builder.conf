# Shared NanoPC-T6 LTS builder settings.
# Environment variables take precedence over these defaults.

SRC_ROOT=${SRC_ROOT:-${BUILDER_ROOT}/src}
TXZ_ROOT=${TXZ_ROOT:-${BUILDER_ROOT}/txz}
OUTPUT_ROOT=${OUTPUT_ROOT:-${BUILDER_ROOT}/output}

FREEBSD_SRC_DIR=${FREEBSD_SRC_DIR:-${SRC_ROOT}/freebsd-src}
UBOOT_SRC_DIR=${UBOOT_SRC_DIR:-${SRC_ROOT}/u-boot-2017}
IF_RGE_SRC_DIR=${IF_RGE_SRC_DIR:-${SRC_ROOT}/if_rge_freebsd}
RKBIN_SRC_DIR=${RKBIN_SRC_DIR:-${SRC_ROOT}/rkbin}
PREBUILT_SRC_DIR=${PREBUILT_SRC_DIR:-${SRC_ROOT}/prebuilt}

# ==============================================================================
# Git checkout settings
GIT_URL=${GIT_URL:-git@git.lo:yuri}

FREEBSD_BRANCH=${FREEBSD_BRANCH:-yuri/14.3-p16_rk3588-overlay}
FREEBSD_COMMIT=${FREEBSD_COMMIT:-}

UBOOT_BRANCH=${UBOOT_BRANCH:-yuri/nanopc-t6_lts}
UBOOT_COMMIT=${UBOOT_COMMIT:-}

IF_RGE_BRANCH=${IF_RGE_BRANCH:-yuri/14.3}
IF_RGE_COMMIT=${IF_RGE_COMMIT:-}

RKBIN_BRANCH=${RKBIN_BRANCH:-master}
RKBIN_COMMIT=${RKBIN_COMMIT:-}
# ==============================================================================

FREEBSD_OBJ=${FREEBSD_OBJ:-/usr/obj/usr/src/arm64.aarch64}
KERNBUILDDIR=${KERNBUILDDIR:-${FREEBSD_OBJ}/sys/RK3588-T6-NORE}

IDBLOADER_SRC=${IDBLOADER_SRC:-${PREBUILT_SRC_DIR}/idbloader.img}
KERNEL_DTB=${KERNEL_DTB:-${BUILDER_ROOT}/dtb/rk3588-nanopi6-rev07.dtb}
MENU_CMD=${MENU_CMD:-${BUILDER_ROOT}/menu/freebsd14-r26-bootmenu3s.cmd}
UBOOT_LOGO_BMP=${UBOOT_LOGO_BMP:-${UBOOT_SRC_DIR}/assets/logo.bmp}
FIRMWARE_MIB=${FIRMWARE_MIB:-16}
MKIMAGE=${MKIMAGE:-/usr/local/bin/mkimage}
CROSS_COMPILE=${CROSS_COMPILE:-aarch64-none-elf-}
JOBS=${JOBS:-$(sysctl -n hw.ncpu 2>/dev/null || echo 4)}

RGE_OUTPUT_DIR=${RGE_OUTPUT_DIR:-${OUTPUT_ROOT}/if_rge_freebsd}
RGE_OBJ_ROOT=${RGE_OBJ_ROOT:-${RGE_OUTPUT_DIR}/obj}
TOOLBIN=${TOOLBIN:-${FREEBSD_OBJ}/tmp/usr/bin}

BASE_TXZ=${BASE_TXZ:-${TXZ_ROOT}/base.txz}
KERNEL_TXZ=${KERNEL_TXZ:-${TXZ_ROOT}/kernel.txz}
RGE_TXZ=${RGE_TXZ:-${RGE_OUTPUT_DIR}/if_rge.txz}
UBOOT_DIR=${UBOOT_DIR:-${OUTPUT_ROOT}/uboot-latest}
IMAGE_DTB=${IMAGE_DTB:-${BUILDER_ROOT}/dtb/rk3588-nanopc-t6.dtb}
IMAGE_LOGO_BMP=${IMAGE_LOGO_BMP:-${UBOOT_DIR}/logo.bmp}
